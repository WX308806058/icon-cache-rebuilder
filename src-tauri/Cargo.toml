[package]
name = "icon-cache-rebuilder"
version = "0.1.0"
description = "Windows 图标缓存重建工具"
authors = ["OAO"]
edition = "2021"

[lib]
name = "icon_cache_rebuilder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 关闭 system-proxy 特性：更新检查强制直连（ghproxy 国内镜像可直连），
# 避免本机代理工具（仅加速 GitHub 等白名单域名）拦截 updater 请求导致升级失败
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "zip"] }
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Win32 API：右键菜单注册表读写（RegSetKeyValueW 等）+ 无窗口模式的 MessageBox 结果弹窗
windows-sys = { version = "0.60", features = ["Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

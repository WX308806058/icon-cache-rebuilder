name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 应用内发版使用附注标签（git tag -a -m "发布说明"）：
      # 读取标签注释作为 GitHub Release 页面说明；手动打的轻量标签无注释时回退到固定文案
      - name: Extract release notes from tag
        id: notes
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --force origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          NOTES=$(git tag -l --format='%(contents)' "${TAG_NAME}")
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="Windows 系统优化工具（图标缓存重建 / 右键菜单集成 / WorkBuddy 菜单清理）。老版本可直接在线升级；新用户可下载下方 setup.exe 安装。"
          fi
          {
            echo "notes<<TAG_NOTES_EOF"
            printf '%s\n' "$NOTES"
            echo "TAG_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 发版只需要打 tag，版本号自动从 tag 同步，无需手动改 tauri.conf.json
      - name: Sync version from tag
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: >
          node -e "const fs=require('fs');const tag=process.env.TAG_NAME.replace(/^v/,'');
          for(const p of ['./package.json','./src-tauri/tauri.conf.json']){
          const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=tag;
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');}
          console.log('version synced to '+tag);"

      - name: Install frontend dependencies
        run: npm install

      # 构建 NSIS 安装包并用 TAURI_SIGNING_PRIVATE_KEY 签名，
      # 自动上传 setup.exe / .sig / latest.json 并直接发布（releaseDraft: false）
      - name: Build and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "系统优化工具 v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.notes }}
          releaseDraft: false
          prerelease: false

      # latest.json 里的下载地址默认是 GitHub 官方直链，国内直连不稳定，
      # 统一改写为 gh-proxy.com 镜像前缀（实测 ~2MB/s，ghproxy.net 仅 ~33KB/s）
      - name: Mirror latest.json download URLs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --pattern latest.json --clobber
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('latest.json','utf8'));
            for(const k of Object.keys(j.platforms)){
              j.platforms[k].url='https://gh-proxy.com/'+j.platforms[k].url;
            }
            fs.writeFileSync('latest.json',JSON.stringify(j,null,2)+'\n');
            console.log('latest.json URLs rewritten to gh-proxy mirror');"
          gh release upload "$TAG_NAME" latest.json --repo "$GITHUB_REPOSITORY" --clobber

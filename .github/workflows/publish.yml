name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 应用内发版使用附注标签（git tag -a -m "发布说明"）：
      # 读取标签注释作为 GitHub Release 页面说明；手动打的轻量标签无注释时回退到固定文案
      - name: Extract release notes from tag
        id: notes
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --force origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          NOTES=$(git tag -l --format='%(contents)' "${TAG_NAME}")
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="Windows 系统优化工具（图标缓存重建 / 右键菜单集成 / WorkBuddy 菜单清理）。老版本可直接在线升级；新用户可下载下方 setup.exe 安装。"
          fi
          {
            echo "notes<<TAG_NOTES_EOF"
            printf '%s\n' "$NOTES"
            echo "TAG_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 发版只需要打 tag，版本号自动从 tag 同步，无需手动改 tauri.conf.json
      - name: Sync version from tag
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: >
          node -e "const fs=require('fs');const tag=process.env.TAG_NAME.replace(/^v/,'');
          for(const p of ['./package.json','./src-tauri/tauri.conf.json']){
          const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=tag;
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');}
          console.log('version synced to '+tag);"

      - name: Install frontend dependencies
        run: npm install

      # tauri-action 无法处理中文 productName：资产名被剥成 "_0.9.0_x64-setup.exe"（v0.9.0 实测），
      # 且不生成 latest.json，导致老客户端无法自动升级。
      # 改为直接 tauri build + gh CLI 上传：资产名取自实际构建产物，latest.json 手工生成，全程可控
      - name: Build signed installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npx tauri build

      - name: Create release and upload installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          VER="${TAG_NAME#v}"
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "系统优化工具 v$VER" --notes "$NOTES" --verify-tag
          SETUP_EXE=$(ls "src-tauri/target/release/bundle/nsis/"*-setup.exe | head -n1)
          # GitHub 资产名不支持非 ASCII（中文会被静默剥离成 "_0.9.0_x64-setup.exe"，v0.9.0 实测），
          # 上传前复制为 ASCII 名；latest.json 的 URL 也指向该名字
          ASSET_NAME="SystemOptimizer_${VER}_x64-setup.exe"
          mkdir -p bundle-out
          cp "$SETUP_EXE" "bundle-out/$ASSET_NAME"
          cp "$SETUP_EXE.sig" "bundle-out/$ASSET_NAME.sig"
          echo "installer asset: $ASSET_NAME"
          gh release upload "$TAG_NAME" "bundle-out/$ASSET_NAME" "bundle-out/$ASSET_NAME.sig" --repo "$GITHUB_REPOSITORY" --clobber

      # 生成 latest.json（老客户端自动升级的更新清单）：
      # signature = .sig 文件内容原样——tauri v2 构建出的 .sig 本身已是 base64 编码的 minisign 签名，
      # 切勿再做 base64（双重编码会让客户端报 "Invalid encoding in minisign data"，v0.9.1 实测）；
      # url 直接套 gh-proxy.com 镜像前缀（国内实测 ~2MB/s）
      - name: Generate and upload latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          VER="${TAG_NAME#v}"
          ASSET_NAME="SystemOptimizer_${VER}_x64-setup.exe"
          node -e '
            const fs = require("fs");
            const sig = fs.readFileSync(process.argv[1]).toString("utf8").trim();
            const name = process.argv[2];
            const url = "https://gh-proxy.com/https://github.com/" + process.env.GITHUB_REPOSITORY
              + "/releases/download/" + process.env.TAG_NAME + "/" + encodeURIComponent(name);
            const j = {
              version: process.env.TAG_NAME.replace(/^v/, ""),
              notes: process.env.NOTES,
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": { signature: sig, url: url },
                "windows-x86_64-nsis": { signature: sig, url: url },
              },
            };
            fs.writeFileSync("latest.json", JSON.stringify(j, null, 2) + "\n");
            console.log("latest.json generated for " + name);
          ' "bundle-out/$ASSET_NAME.sig" "$ASSET_NAME"
          gh release upload "$TAG_NAME" latest.json --repo "$GITHUB_REPOSITORY" --clobber
